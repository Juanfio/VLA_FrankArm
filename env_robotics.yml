channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults

dependencies:
  # Python
  - python=3.10

  # PyTorch — CPU-only build; change to pytorch-cuda=11.8 if you have a GPU
  - pytorch::pytorch=2.2.2
  - pytorch::torchvision=0.17.2
  - pytorch::torchaudio=2.2.2
  - pytorch::cpuonly          # remove this line if you have a CUDA GPU

  # Scientific stack
  - numpy=1.26.4
  - scipy=1.13.0
  - matplotlib=3.8.4
  - pandas=2.2.2
  - scikit-learn=1.4.2
  - pip
  - h5py=3.11.0               # store demonstrations as HDF5
  
  # Development
  - jupyterlab=4.1.6
  - ipywidgets=8.1.2
  - black=24.4.2

  - opencv==4.9.0.80 # Computer vision
  - pip:
    # Simulation
    - pybullet==3.2.6         # physics simulator
    - gymnasium==0.29.1       # standard RL/IL environment API
    - pybullet-data==0.0.1    # pre-built URDF assets (Franka, tables, objects)

    # Imitation learning / diffusion policy
    - diffusers==0.27.2       # HuggingFace diffusion primitives (noise schedulers)
    - einops==0.8.0           # tensor rearrangement used by Diffusion Policy
    - hydra-core==1.3.2       # config management
    - omegaconf==2.3.0

    # Data and logging
    - wandb==0.17.0           # experiment tracking (free tier)
    - tqdm==4.66.4
    - zarr==2.18.2            # efficient array storage for trajectories

    - Pillow==10.3.0 # Computer vision

    # Utilities
    - pynput==1.7.7           # keyboard/mouse for scripted oracle teleoperation
    - imageio==2.34.1
    - imageio-ffmpeg==0.4.9   # save rollout videos
    - robosuite==1.4.1        # optional: provides extra robot assets and wrappers

    # Developmenet
    - pytest==8.2.0